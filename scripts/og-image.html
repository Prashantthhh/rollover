<!doctype html>
<!-- Template for public/og-image.png (1200x630): retro-parlour style, halftone photo in an arched window.
     Rebuild: `npm run build`, then replace FONT with the Shrikhand file in out/_next/static/media/*.p.woff2, open at a
     1200x630 viewport in any browser and screenshot. scripts/og-photo.png is the halftone-duotone photo (see HANDOFF.md). -->
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Shrikhand"; src: url("FONT") format("woff2"); }
  :root { --pink: #eb3592; --cream: #fef2f3; --maroon: #340a1b; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--cream); color: var(--maroon); position: relative; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 12px; background: var(--maroon); }
  .eyebrow { position: absolute; left: 64px; top: 70px; font-weight: 800; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; }
  h1 { position: absolute; left: 64px; top: 120px; font-family: "Shrikhand", serif; font-weight: 400; font-size: 98px; line-height: 1.04; }
  h1 span { display: block; color: var(--pink); }
  .tag { position: absolute; left: 64px; top: 372px; width: 560px; font-size: 30px; line-height: 1.25; }
  .logo { position: absolute; left: 64px; bottom: 56px; height: 62px; }
  .price { position: absolute; left: 380px; bottom: 62px; font-weight: 800; font-size: 24px; letter-spacing: 3px; text-transform: uppercase; background: var(--maroon); color: var(--cream); padding: 12px 22px; }
  .shadow { position: absolute; right: 70px; top: 70px; width: 372px; height: 520px; background: var(--pink); border-radius: 999px 999px 0 0; transform: translate(16px, 16px); }
  .frame { position: absolute; right: 70px; top: 70px; width: 372px; height: 520px; background: var(--maroon); border-radius: 999px 999px 0 0; padding: 14px; }
  .frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px 999px 0 0; display: block; }
</style>
<div class="bar"></div>
<div class="eyebrow">Chaitanyapuri Colony, Hanamkonda</div>
<h1>Rolled while<span>you watch.</span></h1>
<div class="tag">Ice cream rolled on a cold plate in front of you. Shakes, momos and munchies too.</div>
<img class="logo" src="../public/img/brand/logo.webp" alt="" />
<div class="price">Rolls from ₹125</div>
<div class="shadow"></div>
<div class="frame"><img src="og-photo.png" alt="" /></div>
